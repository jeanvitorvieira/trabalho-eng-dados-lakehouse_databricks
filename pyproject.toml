[project]
name = "lakehouse-databricks-medalhao"
version = "0.1.0"
description = "Lakehouse com Databricks Free Edition e arquitetura medalhão (Landing -> Bronze -> Silver -> Gold)"
authors = [
    {name = "Seu Nome",email = "seu.email@exemplo.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyspark (>=4.2.0,<5.0.0)",
    "delta-spark (>=4.4.1,<5.0.0)",
    "install-jdk (>=1.1.0,<2.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "pandas (>=3.0.6,<4.0.0)"
]

[tool.poetry]
packages = [{include = "lakehouse_databricks", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "jupyterlab (>=4.6.4,<5.0.0)",
    "ipykernel (>=7.4.0,<8.0.0)",
    "mkdocs (>=1.6.1,<2.0.0)",
    "mkdocs-material (>=9.7.7,<10.0.0)"
]
